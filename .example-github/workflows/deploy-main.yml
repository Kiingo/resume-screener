name: Deploy to npm

on:
  push:
    branches:
      - main # or your default branch
      - develop

jobs:
  build-and-publish:
    name: Build, lint, test, and deploy npm package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event.commits == null || github.event.commits[0].author.name != 'GitHub Action' }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Check commit message for version pattern
        id: check_message
        run: |
          if [[ "${{ github.event.head_commit.message }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || [[ "${{ github.event.head_commit.message }}" =~ \[do-not-build\] ]]; then
            echo "Commit message matches version pattern or contains [do-not-build]. Aborting."
            echo "::set-output name=skip::true"
            exit 1
          else
            echo "Commit message does not match version pattern and does not contain [do-not-build]."
            echo "::set-output name=skip::false"
          fi

      - name: Check if NPM_AUTH_TOKEN is set
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          if [[ -z "${NPM_AUTH_TOKEN}" ]]; then
            echo "NPM_AUTH_TOKEN is NOT set";
            exit 1;  # Exit the script with a non-zero status code to indicate failure
          else
            echo "NPM_AUTH_TOKEN is set";
          fi

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.VERSION_BUMPER_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get package name
        id: package
        run: echo "::set-output name=package_name::$(jq -r '.name' package.json)"

      - name: Read .nvmrc
        id: nvm
        run: echo "::set-output name=version::$(cat .nvmrc)"

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.nvm.outputs.version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --ci --coverage --maxWorkers=2

      - name: Build package
        run: |
          branch_name="${GITHUB_REF#refs/heads/}"  # Extract branch name from reference
          if [[ "$branch_name" == "main" ]] || [[ "$branch_name" == "stage" ]]; then
            yarn run build:prod
          else
            yarn run build:dev
          fi

      - name: Run tests
        run: yarn test # or your test command

      - name: Configure Git User
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump package version
        run: |
          branch_name="${GITHUB_REF#refs/heads/}"  # Extract branch name from reference
          if [[ "$branch_name" == "main" ]]; then
            yarn version --minor
          else
            yarn version --patch
          fi

      - name: Stage Files and Commit changes
        run: |
          git add package.json || true
          git commit -m "Bump package version [do-not-build]" || true

      - name: Check and Create Tag
        run: |
          if ! git rev-parse "v$(jq -r '.version' package.json)" >/dev/null 2>&1; then
            git tag "v$(jq -r '.version' package.json)"
            git push --tags
          else
            echo "Tag already exists. Not creating."
          fi

      # Make sure this pushes to the correct branch
      # Note that GITHUB_TOKEN is a secret set by GitHub Actions, so you don't need to create your own
      - name: Push changes
        run: |
          branch_name="${GITHUB_REF#refs/heads/}" # Extract branch name from reference
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
          git push --force origin $branch_name
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set npm tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "::set-output name=TAG::--tag develop"
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            echo "::set-output name=TAG::--tag stage"
          else
            echo "::set-output name=TAG::"
          fi

      # Install development via `yarn add @my-org/my-package@development`
      # Install staging via `yarn add @my-org/my-package@stage`
      # Install production via `yarn add @my-org/my-package`
      - name: Publish package
        run: yarn publish ${{ steps.set_tag.outputs.TAG }}
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}

      - name: Upload yarn-error.log
        if: failure() # This ensures the step is executed only if a previous step failed
        uses: actions/upload-artifact@v4
        with:
          name: yarn-error-log
          path: ${{ github.workspace }}/yarn-error.log

      - name: Notify Teams on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" -d "{'text':'**SUCCESS**: GitHub Action for **${{ steps.package.outputs.package_name }}**!\n\n\n\nyarn upgrade @kiingo/${{ steps.package.outputs.package_name }}@develop --latest\n\nyarn add @kiingo/${{ steps.package.outputs.package_name }}@develop --latest'}" https://kiingo.webhook.office.com/webhookb2/3b9522e6-db21-4800-ae3b-10883a968c0d@3205e88e-b728-4ab3-82ff-18e148cad4c4/IncomingWebhook/4808ec8ffe3045808aef46e769e3ec68/80f48d03-40c0-4803-b873-ffb554c56e9a

      - name: Notify Teams on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -d "{'text':'**FAILURE**: GitHub Action for **${{ steps.package.outputs.package_name }}**!'}" https://kiingo.webhook.office.com/webhookb2/3b9522e6-db21-4800-ae3b-10883a968c0d@3205e88e-b728-4ab3-82ff-18e148cad4c4/IncomingWebhook/4808ec8ffe3045808aef46e769e3ec68/80f48d03-40c0-4803-b873-ffb554c56e9a
